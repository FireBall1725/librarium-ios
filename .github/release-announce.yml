# Drives the Discord post in #releases.

project:
  name: Librarium for iOS
  emoji: "📚"
  footer: "Librarium · self-hosted book, manga, and comic tracker"

channels:
  stable:
    announce: true
    colour: "0x2ECC71"
    prefix: ""
  # The iOS app has no release-candidate channel: builds go to TestFlight,
  # which is the testing step the other repos use an -rc tag for. Kept here
  # with announce off so the shape matches the other repos and turning it
  # on later is a one-line change.
  rc:
    announce: false
    colour: "0xF1C40F"
    prefix: "Release candidate — "
  nightly:
    announce: false

# No `docker pull` line: this repo ships an app, not an image. A release
# tags the source and dispatches TestFlight, so the build reaches testers
# through Apple rather than a registry.
getting_started: |
  Rolling out to TestFlight now. Builds take a few minutes to finish
  processing before Apple sends the notification.

links:
  - name: Site
    url: https://librarium.press/
  - name: Source
    url: https://github.com/{{repo}}
  - name: Changes
    url: "{{compare_url}}"
