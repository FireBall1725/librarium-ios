name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto    # next revision in current YY.MM (rolls to .0 on month change)
          - major   # force YY.MM.0 from today's date
      dry-run:
        description: "Compute the version but don't tag, push, or publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write   # needed for `gh workflow run testflight.yml` dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      next_dev: ${{ steps.version.outputs.next_dev }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          YY=$(date -u +%y)
          MM=$(date -u +%-m)
          PREFIX="${YY}.${MM}"

          if [ "$BUMP" = "major" ]; then
            REV=0
          else
            LAST=$(git tag --list "v${PREFIX}.*" | sort -V | tail -n1 || true)
            if [ -z "$LAST" ]; then
              REV=0
            else
              LAST_REV=${LAST##*.}
              REV=$((LAST_REV + 1))
            fi
          fi

          VERSION="${PREFIX}.${REV}"
          # Per the workspace versioning convention (CLAUDE.md): local /
          # CI dev builds carry the literal `YY.M.DEV` — not the legacy
          # `YY.M.{R+1}-dev` suffix form. Debug bumps back to .DEV after
          # every release; the Release config stays pinned at $VERSION.
          NEXT_DEV="${PREFIX}.DEV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next_dev=$NEXT_DEV" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      # Nothing in the source tree carries a version string, which is how
      # every other repo works. This used to sed MARKETING_VERSION into
      # project.pbxproj, commit it, tag, then commit again to put Debug back
      # to a -dev value.
      #
      # None of that was load-bearing. testflight.yml passes
      # MARKETING_VERSION to xcodebuild at archive time, so the archive never
      # reads the committed value; the tag already records the number.
      #
      # Removing it also removes the reason this workflow had to push to main,
      # which is what lets main be protected without a bypass or a PAT.
      - name: Tag the release
        if: ${{ inputs.dry-run == false }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: ${{ inputs.dry-run == false }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      # Tag pushes performed with the default GITHUB_TOKEN don't trigger
      # dependent `push:` workflows, so `testflight.yml` won't auto-fire off
      # the tag we just pushed. workflow_dispatch is an exception to that
      # rule, so we kick it off explicitly here with --ref pointed at the
      # newly-created tag.
      - name: Dispatch TestFlight workflow
        if: ${{ inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run testflight.yml \
            --ref "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}"

  # Posts to #releases. Separate job rather than a step because
  # announce-discord.yml is a reusable workflow, and a job that calls one
  # accepts only uses/with/secrets/needs/if. Every step inside it is
  # continue-on-error: a Discord outage must not fail a release whose tag
  # and TestFlight build already went out.
  #
  # No `image` input — this repo ships an app, not a container.
  announce:
    needs: release
    if: ${{ inputs.dry-run == false }}
    uses: FireBall1725/workflows/.github/workflows/announce-discord.yml@v1
    with:
      version: ${{ needs.release.outputs.version }}
      channel: stable
    secrets: inherit
